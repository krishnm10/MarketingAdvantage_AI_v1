    display_name:              "BGE Reranker v2-m3 (Multilingual)"
    max_input_tokens_per_pair: 8192
    score_space:               "logit"
    supports_batch_scoring:    true
    lang_support:              ["*"]
    tokenizer_family:          "sentencepiece"
    tier:                      "local"
    requires_gpu:              true
    default_top_k:             5
    notes_short:               "Multilingual BGE reranker; large context window; GPU recommended."
    env_key:                   null

  - model_id:                  "BAAI/bge-reranker-large"
    provider:                  "huggingface"
    display_name:              "BGE Reranker Large (English)"
    max_input_tokens_per_pair: 512
    score_space:               "logit"
    supports_batch_scoring:    true
    lang_support:              ["en", "zh"]
