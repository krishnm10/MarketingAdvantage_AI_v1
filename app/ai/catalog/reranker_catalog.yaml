    tier:                      "local"
    requires_gpu:              true
    default_top_k:             5
    notes_short:               "BGE large reranker; strong English/Chinese performance."
    env_key:                   null

  # ── FlashRank (CPU-optimised, no GPU required) ────────────────────────────

  - model_id:                  "flashrank/ms-marco-MiniLM-L-12-v2"
