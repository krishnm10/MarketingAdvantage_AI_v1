# =============================================================================
# app/ai/catalog/reranker_catalog.yaml
#
# Canonical reranker catalog for Phase 2.
#
# Schema fields per entry:
#   model_id                  — unique identifier; used in ClientConfig and UI
#   provider                  — matches RerankerProvider enum
#   display_name              — human-readable label for UI
#   max_input_tokens_per_pair — hard limit for query+passage token count
#   score_space               — "probability" | "logit" | "cosine"
#   supports_batch_scoring    — bool; true = all pairs in one call
#   lang_support              — ISO-639-1 codes; ["*"] = multilingual
#   tokenizer_family          — own tokenizer family; "external" = API-managed
#   tier                      — "local" | "api" | "hosted"
#   requires_gpu              — bool
#   notes_short               — concise capability note for UI display
#   default_top_k             — recommended top-k for this reranker
#   env_key                   — env var name for API key (API-based only)
# =============================================================================

schema_version: "2.0"

rerankers:

  # ── Local cross-encoder (HuggingFace sentence-transformers) ──────────────

  - model_id:                  "cross-encoder/ms-marco-MiniLM-L-6-v2"
    provider:                  "huggingface"
    display_name:              "MiniLM-L6 Cross-Encoder (MS-MARCO)"
    max_input_tokens_per_pair: 512
    score_space:               "logit"
    supports_batch_scoring:    true
    lang_support:              ["en"]
    tokenizer_family:          "wordpiece"
    tier:                      "local"
    requires_gpu:              false
    default_top_k:             5
    notes_short:               "Fast cross-encoder; 6-layer MiniLM; good for English QA."
    env_key:                   null

  - model_id:                  "cross-encoder/ms-marco-MiniLM-L-12-v2"
    provider:                  "huggingface"
    display_name:              "MiniLM-L12 Cross-Encoder (MS-MARCO)"
    max_input_tokens_per_pair: 512
    score_space:               "logit"
    supports_batch_scoring:    true
    lang_support:              ["en"]
    tokenizer_family:          "wordpiece"
    tier:                      "local"
    requires_gpu:              false
    default_top_k:             5
    notes_short:               "12-layer MiniLM; higher quality than L6 at moderate cost."
    env_key:                   null

  - model_id:                  "BAAI/bge-reranker-v2-m3"
